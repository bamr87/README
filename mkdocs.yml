site_name: bamr87 Documentation
site_description: Aggregated documentation built from multiple source repositories
site_author: Amr Abdel-Motaleb
site_url: https://bamr87.github.io/README/

# Repository
repo_name: bamr87/README
repo_url: https://github.com/bamr87/README
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Amr Abdel-Motaleb

# Configuration
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
# GENERATED, not curated: nav.yml carries the `nav` tree and the matching
# `exclude_docs` rules, both rendered by the context engine's navigator from
# the docs/ folder hierarchy and the navigation contract in
# _data/projects.yml. INHERIT merges it in, so the left sidebar always
# mirrors the published corpus. Rebuild with:
#   python3 -m scripts.context_engine build
# Do not add a `nav:` key here - it would override the generated one.
INHERIT: ./nav.yml

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bamr87
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/amrabdel
    - icon: fontawesome/solid/globe
      link: https://bashconsultants.com
