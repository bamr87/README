# =============================================================================
# features/features.yml — THE FEATURE INDEX for README
# =============================================================================
# kit: verify v0.1.0 (seeded from bamr87/bamr87 templates/verify/)
#
# One entry per user-facing capability. This file is what an AI agent reads to
# know what the product DOES, where it lives, how it is documented, which tests
# and user scenarios prove it, and what evidence exists that it works. The hub
# aggregates every repo's copy into its fleet features index
# (bamr87/bamr87 _data/features_index.yml → /features/) and grades coverage:
#
#   covered    ≥1 of `tests` / `scenarios` exists on disk
#   evidenced  ≥1 `evidence` bundle exists (README + screenshots + report)
#   verified   `verified.date` is set (by an agent, a human, or CI)
#
# Schema: features/v1 — a strict SUPERSET of the shape zer0-mistakes,
# it-journey, and barodybroject already use, so legacy files validate as-is.
# Validate: python3 <hub>/tools/features_index.py check .
#
# Per feature:
#   id            required  STABLE id, `^[A-Z0-9]+-[0-9]+$` (prefix per repo, e.g. ZER0-001)
#   title         required  short name
#   description   required  one or two sentences — what the user can do
#   implemented   required  true|false (planned features are welcome — they show as gaps)
#   surface       optional  ui | api | cli | docs | content | infra (default: ui when `link`
#                           is a route starting with `/`, else infra)
#   link          optional  the route (`/settings/`) or file that IS the feature
#   docs          optional  where it is explained (path or URL)
#   tags          optional  list
#   date          optional  YYYY-MM-DD introduced
#   provenance    optional  { introduced_in, pr, commit, issue }
#   tests         optional  automated test files that pin it (paths)
#   scenarios     optional  declarative user scenarios (verify/scenarios/*.yml)
#   evidence      optional  evidence bundle dirs (test/evidence/<slug>/)
#   screenshots   optional  direct image paths, when a bundle is overkill
#   verified      optional  { date, by: agent|human|ci, run: <url> } — last verification
#   deviations    optional  free text: why a MUST row is waived for this feature
# =============================================================================
schema: features/v1
repo: bamr87/README

features:
  - id: README-001
    title: "Published fleet documentation site"
    description: "Browse the aggregated fleet corpus on bamr87.github.io/README: the generated fleet overview is the home page and the sidebar is derived from each project's folder hierarchy."
    implemented: true
    surface: ui
    link: /
    docs: MKDOCS.md
    tags: [site, mkdocs, navigation]
    tests:
      - tests/unit/test_cases/test_context_engine.py
    scenarios:
      - verify/scenarios/smoke-home.yml
    evidence: []
  - id: README-002
    title: "Context engine CLI"
    description: "Build the context pyramid and query it from the shell: `python3 -m scripts.context_engine build|query|card|nav|status`."
    implemented: true
    surface: cli
    link: scripts/context_engine/cli.py
    docs: scripts/README.md
    tags: [context-engine, cli]
    tests:
      - tests/unit/test_cases/test_context_engine.py
    scenarios: []
    evidence: []
  - id: README-003
    title: "MCP query server"
    description: "AI clients query the pyramid read-only over MCP (stdio JSON-RPC): list_projects, get_project, search_context, get_readme, get_nav, get_schema, context_status."
    implemented: true
    surface: api
    link: mcp/server.py
    docs: mcp/README.md
    tags: [mcp, context-engine]
    tests:
      - tests/unit/test_cases/test_context_engine.py
    scenarios: []
    evidence: []
