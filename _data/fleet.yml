# _data/fleet.yml - the fleet inventory.
#
# Every public repository under the bamr87 account, and what kind of thing
# each one is. This is the input to the documentation survey
# (`python3 -m scripts.context_engine survey`), which clones each entry
# shallowly, runs the checks in scripts/context_engine/analyze/, and writes
# context/reports/fleet_health.{json,md}.
#
# It is deliberately SEPARATE from _data/projects.yml: that registry says
# which projects are aggregated into the docs/ corpus, a much smaller set.
# A repository can be surveyed without being crawled.
#
# Hand-maintained. Seeded from a GitHub inventory on 2026-09-15; add a repo
# here when it is created and set its kind. `kind` selects the governance
# profile in scripts/context_engine/analyze/checks.py (PROFILES).
#
# GitHub-side metadata (description, topics, detected license) is a separate,
# generated snapshot at context/sources/github.json - it is what check G10
# reads, and it goes stale until refreshed.

version: 1

defaults:
  kind: default
  visibility: public
  fork: false
  survey: true

repos:
  - name: .github
    repo: bamr87/.github
    url: https://github.com/bamr87/.github
    kind: docs
    note: "Org-level community health files and reusable workflows"
