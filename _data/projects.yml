# _data/projects.yml — fleet registry for the README context engine.
#
# SOURCE OF TRUTH for the set of submodules this repo describes (mirrors the
# parent monorepo convention: structural facts live in the registry; generated
# surfaces are regenerated, never hand-edited).
#
# Consumers:
#   - scripts/context_engine (crawl targets, card/apex generation, index)
#   - repos.txt              (GENERATED from this file via `context_engine sync`)
#   - mcp/server.py          (list_projects / get_project)
#
# Field reference (per project):
#   name        - short slug; must match the docs/<name>/ corpus directory
#   repo        - owner/name on GitHub
#   url         - clone URL
#   branch      - branch to aggregate (omit for the repo default)
#   status      - active | incubating | archived (archived repos are skipped)
#   kind        - what the project is (site, theme, tooling, app, game, docs)
#   description - seed description; the engine prefers the crawled README
#                 summary and falls back to this
#   topics      - seed topic tags merged with tags mined from the corpus
#   aggregate   - include in the docs/ corpus aggregation (default true)
#   external    - true when the project is not owned by the bamr87 org
#   nav         - navigation overrides (see the `navigation:` block below)
#   collect     - what counts as this project's official documentation:
#                 `exclude` and `include` globs added to the fleet-wide
#                 `collect:` block below

version: 1

hub:
  name: bamr87
  repo: bamr87/bamr87
  url: https://github.com/bamr87/bamr87
  description: >-
    Monorepo dash — control plane for the project fleet: registry, gates,
    seeds, and site. This README repo is its consolidated-context submodule.

# ---------------------------------------------------------------------------
# collect - what the crawl treats as official documentation. The ETL in
# `scripts/context_engine/collect.py` takes every git-tracked Markdown file of
# a project, drops the paths matching `exclude` unless a project's `include`
# claims them back, and writes the rest to docs/<name>/.
#
# Dot-directories are renamed with `hidden_prefix`, segment by segment
# (.github/skills -> dot-github/skills), because neither GitHub Pages nor
# Obsidian shows a dot-prefixed path. The structure is otherwise untouched.
collect:
  hidden_prefix: "dot-"
  exclude:
    # Dot-directories hold agent and editor configuration and repository
    # plumbing, not documentation. A project claims one back with `include`.
    - ".*/**"
    - "**/.*/**"
    # Generated output and working files.
    - "**/_reports/**"
    - "**/_site/**"
    - "**/drafts/**"
    - "**/node_modules/**"
    - "**/vendor/**"
    - "link-check-results/**"
    - "logs/**"
    - "TODO/**"
    # Test fixtures and solutions.
    - "test/**"
    - "tests/**"
    - "**/tests/**"
    - "**/fixtures/**"

# ---------------------------------------------------------------------------
# brain - the generated notes under docs/brain/. A tag or an unresolved
# wikilink becomes a concept note once enough pages share it, so the notes
# follow the corpus. See `scripts/context_engine/brain.py`.
#
#   concept_min_pages - pages that must carry a tag before it becomes a concept
#   concept_min_links - unresolved [[wikilinks]] needed to create a stub concept
#   concept_max       - cap on concept notes, most-connected first
#   ai_budget         - concept summaries the AI may refresh per build
#   concept_stop      - tags that describe a page's status, not its subject
#   concept_aliases   - spelling variants folded into one concept
brain:
  concept_min_pages: 5
  concept_min_links: 3
  concept_max: 150
  ai_budget: 25
  concept_stop:
    - documentation
    - draft
    - fail
    - gamified-learning
    - hands-on
    - main_quest
    - pass
    - quest-perfection
    - side_quest
    - todo
    - walkthrough
    - warn
  concept_aliases:
    ci/cd: ci-cd
    cicd: ci-cd
    github_actions: github-actions
    gh-pages: github-pages

# ---------------------------------------------------------------------------
# navigation - the contract between the corpus folder hierarchy and the
# published left sidebar. `scripts/context_engine/navigator.py` is the only
# consumer: it walks docs/<project>/, applies these rules, and emits
# context/nav/*.json (frontend-agnostic), nav.yml (MkDocs `nav` +
# `exclude_docs`), and docs/browse/ (human content maps).
#
# Fleet-wide keys:
#   max_depth      - how deep sections may nest before deeper pages are
#                    flattened into the deepest allowed section (never dropped)
#   index_names    - filenames treated as a section's landing page, in order
#   exclude        - glob patterns removed from navigation *and* from the site
#   publish_hidden - build dot-directories into the site; MkDocs excludes them
#                    by default. Off: the crawl renames the ones it keeps
#                    (`collect.hidden_prefix`), and docs/.obsidian must stay out
#   navigate_hidden - put those dot-directories in the sidebar too. Left off:
#                    GitHub Pages does not serve a URL containing a
#                    dot-prefixed segment (verified - `_underscore` and plain
#                    paths return 200, every `/.dot/` path returns 404), so a
#                    sidebar entry for one would be a dead link. They stay in
#                    the build and are declared `not_in_nav` instead.
#   section_titles - directory name -> sidebar label (an index page's own
#                    frontmatter title still wins)
#
# Per-project `nav:` keys: title, order, max_depth, exclude, groups, tab.
# `tab` nests a project under a shared top-level tab instead of giving it one.
# A group lifts matching paths into a curated top-level section; patterns are
# matched against project-relative paths (`*` stays inside one path segment,
# `**` spans segments) and matching a directory moves its whole subtree.
navigation:
  max_depth: 6
  index_names: [index.md, README.md, readme.md, home.md]
  publish_hidden: false
  navigate_hidden: false
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
  section_titles:
    dot-frontend: Frontend
    dot-github: GitHub
    dot-quests: Quests
    _data: Data
    _design-system: Design System
    _includes: Includes
    _layouts: Layouts
    _posts: Posts
    _quests: Quests
    api: API
    docs: Documentation
    faq: FAQ
    fr: Français
    infra: Infrastructure
    src: Source
    ui: UI


defaults:
  status: active
  aggregate: true
  external: false

projects:
  - name: scripts
    repo: bamr87/scripts
    url: https://github.com/bamr87/scripts
    kind: tooling
    description: >-
      Automation scripts for forking, linting, stashing, and project
      management across the fleet.
    topics: [automation, bash, python]
    nav:
      title: Scripts
      order: 60

  - name: skills
    repo: microsoft/skills
    url: https://github.com/microsoft/skills
    kind: docs
    external: true
    description: >-
      Agent skills — prompts, MCP configurations, and AI development
      patterns.
    topics: [ai, agents, mcp, prompts]
    # This repository's product lives under .github/, so it claims back what
    # the fleet-wide rules drop as plumbing.
    collect:
      include:
        - ".github/agents/**"
        - ".github/docs/**"
        - ".github/prompts/**"
        - ".github/skills/**"
    nav:
      title: Agent Skills
      order: 50
      max_depth: 7
      groups:
        - title: Skills
          match: ["dot-github/skills"]
        - title: Agents
          match: ["dot-github/agents"]
        - title: Prompts
          match: ["dot-github/prompts"]
        - title: Documentation
          match: ["dot-github/docs", "docs-site"]
        - title: Repository & tooling
          match: ["dot-github", "hooks"]

  # Absorbed into zer0-CMS as apps/parodynews; the repository no longer exists.
  - name: barodybroject
    repo: bamr87/barodybroject
    url: https://github.com/bamr87/barodybroject
    status: archived
    kind: app
    description: >-
      Full-stack application platform with infrastructure, testing, and
      deployment tooling.
    topics: [python, django, azure, full-stack]
    nav:
      title: Barody Project
      order: 30
      max_depth: 7
      groups:
        - title: Repository & tooling
          match: ["infra", "scripts", "test"]

