# _data/projects.yml — fleet registry for the README context engine.
#
# SOURCE OF TRUTH for the set of submodules this repo describes (mirrors the
# parent monorepo convention: structural facts live in the registry; generated
# surfaces are regenerated, never hand-edited).
#
# Consumers:
#   - scripts/context_engine (crawl targets, card/apex generation, index)
#   - repos.txt              (GENERATED from this file via `context_engine sync`)
#   - mcp/server.py          (list_projects / get_project)
#
# Field reference (per project):
#   name        - short slug; must match the docs/<name>/ corpus directory
#   repo        - owner/name on GitHub
#   url         - clone URL
#   branch      - branch to aggregate (omit for the repo default)
#   status      - active | incubating | archived (archived repos are skipped)
#   kind        - what the project is (site, theme, tooling, app, game, docs)
#   description - seed description; the engine prefers the crawled README
#                 summary and falls back to this
#   topics      - seed topic tags merged with tags mined from the corpus
#   aggregate   - include in the docs/ corpus aggregation (default true)
#   external    - true when the project is not owned by the bamr87 org
#   nav         - navigation overrides (see the `navigation:` block below)

version: 1

hub:
  name: bamr87
  repo: bamr87/bamr87
  url: https://github.com/bamr87/bamr87
  description: >-
    Monorepo dash — control plane for the project fleet: registry, gates,
    seeds, and site. This README repo is its consolidated-context submodule.

# ---------------------------------------------------------------------------
# navigation - the contract between the corpus folder hierarchy and the
# published left sidebar. `scripts/context_engine/navigator.py` is the only
# consumer: it walks docs/<project>/, applies these rules, and emits
# context/nav/*.json (frontend-agnostic), nav.yml (MkDocs `nav` +
# `exclude_docs`), and docs/browse/ (human content maps).
#
# Fleet-wide keys:
#   max_depth      - how deep sections may nest before deeper pages are
#                    flattened into the deepest allowed section (never dropped)
#   index_names    - filenames treated as a section's landing page, in order
#   exclude        - glob patterns removed from navigation *and* from the site
#   publish_hidden - build dot-directories (.github, .claude, ...) into the
#                    site; MkDocs excludes them by default
#   navigate_hidden - put those dot-directories in the sidebar too. Left off:
#                    GitHub Pages does not serve a URL containing a
#                    dot-prefixed segment (verified - `_underscore` and plain
#                    paths return 200, every `/.dot/` path returns 404), so a
#                    sidebar entry for one would be a dead link. They stay in
#                    the build and are declared `not_in_nav` instead.
#   section_titles - directory name -> sidebar label (an index page's own
#                    frontmatter title still wins)
#
# Per-project `nav:` keys: title, order, max_depth, exclude, groups.
# A group lifts matching paths into a curated top-level section; patterns are
# matched against project-relative paths (`*` stays inside one path segment,
# `**` spans segments) and matching a directory moves its whole subtree.
navigation:
  max_depth: 6
  index_names: [index.md, README.md, readme.md, home.md]
  publish_hidden: true
  navigate_hidden: false
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
  section_titles:
    .archives: Archives
    .claude: Claude
    .cms: CMS
    .crush: Crush
    .cursor: Cursor
    .devcontainer: Dev Container
    .frontend: Frontend
    .frontmatter: Frontmatter
    .github: GitHub
    .issues: Issues
    .obsidian: Obsidian
    .quests: Quests
    _data: Data
    _design-system: Design System
    _includes: Includes
    _layouts: Layouts
    _posts: Posts
    _quests: Quests
    api: API
    docs: Documentation
    faq: FAQ
    fr: Français
    infra: Infrastructure
    src: Source
    ui: UI


defaults:
  status: active
  aggregate: true
  external: false

projects:
  - name: scripts
    repo: bamr87/scripts
    url: https://github.com/bamr87/scripts
    kind: tooling
    description: >-
      Automation scripts for forking, linting, stashing, and project
      management across the fleet.
    topics: [automation, bash, python]
    nav:
      title: Scripts
      order: 60

  - name: skills
    repo: bamr87/skills
    url: https://github.com/bamr87/skills
    kind: docs
    description: >-
      Agent skills — prompts, MCP configurations, and AI development
      patterns.
    topics: [ai, agents, mcp, prompts]
    nav:
      title: Agent Skills
      order: 50
      max_depth: 7
      # Almost all of this corpus lives under .github/, which GitHub Pages
      # cannot serve, so navigate_hidden keeps it out of the sidebar and only
      # the handful of top-level pages are navigable today. These groups are
      # kept because they are what the sidebar should look like the moment
      # that content becomes servable (see navigate_hidden above).
      groups:
        - title: Skills
          match: [".github/skills"]
        - title: Agents
          match: [".github/agents"]
        - title: Prompts
          match: [".github/prompts"]
        - title: Plugins
          match: [".github/plugins"]
        - title: Documentation
          match: [".github/docs", "docs-site"]
        - title: Workflows
          match: [".github/workflows"]
        - title: Repository & tooling
          match: [".github", "hooks", "tests"]

  - name: barodybroject
    repo: bamr87/barodybroject
    url: https://github.com/bamr87/barodybroject
    kind: app
    description: >-
      Full-stack application platform with infrastructure, testing, and
      deployment tooling.
    topics: [python, django, azure, full-stack]
    nav:
      title: Barody Project
      order: 30
      max_depth: 7
      groups:
        - title: Repository & tooling
          match: [".devcontainer", ".github", "infra", "scripts", "test"]

  - name: bashcrawl
    repo: bamr87/bashcrawl
    url: https://github.com/bamr87/bashcrawl
    kind: game
    description: >-
      Interactive shell-scripting tutorial — learn Bash by exploring a
      dungeon.
    topics: [bash, education, game]
    nav:
      title: Bash Crawl
      order: 40
      exclude: ["logs/**"]
      groups:
        - title: Repository & tooling
          match: [".archives", ".github", "src"]

  - name: zer0-mistakes
    repo: bamr87/zer0-mistakes
    url: https://github.com/bamr87/zer0-mistakes
    kind: theme
    description: >-
      Jekyll theme and software architecture patterns for GitHub Pages.
    topics: [jekyll, theme, github-pages]
    nav:
      title: Zer0 Mistakes
      order: 20
      groups:
        - title: Repository & tooling
          match:
            - ".claude"
            - ".cursor"
            - ".devcontainer"
            - ".github"
            - ".issues"
            - ".obsidian"
            - "docker"
            - "scripts"
            - "test"

  - name: it-journey
    repo: bamr87/it-journey
    url: https://github.com/bamr87/it-journey
    kind: site
    description: >-
      Educational IT platform with quests, blog posts, and technical
      documentation.
    topics: [education, jekyll, quests]
    nav:
      title: IT Journey
      order: 10
      exclude: ["link-check-results/**"]
      groups:
        - title: Quests
          match: [".quests"]
        - title: Repository & tooling
          match:
            - ".claude"
            - ".cms"
            - ".crush"
            - ".cursor"
            - ".devcontainer"
            - ".frontend"
            - ".frontmatter"
            - ".github"
            - ".issues"
            - "TODO"
            - "redirects"
            - "scripts"
            - "test"

  - name: OverTheWire-website
    repo: OverTheWireOrg/OverTheWire-website
    url: https://github.com/OverTheWireOrg/OverTheWire-website
    branch: gh-pages
    kind: site
    external: true
    description: >-
      OverTheWire wargame guides and security-challenge documentation
      (external reference corpus).
    topics: [security, wargames, ctf]
    nav:
      title: OverTheWire
      order: 70
