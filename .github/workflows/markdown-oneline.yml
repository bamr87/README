# Seeded by the bamr87 hub (tools/fanout.sh --kit prose). Enforces the house
# rule "one paragraph per line" in markdown: fails if any tracked *.md has
# soft-wrapped prose. This is the Liquid-safe surgical unwrapper — it only joins
# wrapped prose and leaves Liquid/HTML/tables/code/front-matter untouched.
#
# Fix locally:  python3 tools/unwrap-prose.py --write
name: markdown-oneline

on:
  pull_request:
    paths: ["**/*.md", "**/*.markdown"]
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.markdown"]

permissions:
  contents: read

concurrency:
  group: markdown-oneline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oneline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check one paragraph per line
        run: |
          # docs/ and context/ are GENERATED surfaces in this repo (see SCHEMA.md:
          # "No hand edits to generated surfaces: context/, docs/, repos.txt").
          # docs/ is the L3 corpus aggregated from the repos in repos.txt — including
          # the external OverTheWireOrg/OverTheWire-website — so unwrapping prose
          # there would edit a build artifact, be reverted by the next aggregation
          # run, and diverge this mirror from its upstream. The house one-paragraph-
          # per-line rule applies to the prose this repo actually authors.
          python3 tools/unwrap-prose.py --check \
            --exclude '(^|/)SCHEMA\.md$' --exclude '(^|/)CHANGELOG\.md$' \
            --exclude '^docs/' --exclude '^context/' \
          || { echo "::error::Wrapped markdown prose found. Run: python3 tools/unwrap-prose.py --write"; exit 1; }
